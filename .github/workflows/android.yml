name: Android CI

# Phase K (0.1.0-beta.1): releases are tag-gated. A push to main
# only builds, tests and assembles — it never publishes. A release
# publishes only when a v* tag is pushed, from the `release` job,
# which runs behind the `release` environment's manual approval
# (configured in the repo settings, with the maintainer as reviewer).
# No silent releases: every published build is a deliberate tag +
# an explicit approval.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Fetch sherpa-onnx AAR (pinned 1.13.8)
        run: |
          mkdir -p app/libs
          curl -sL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx.aar" | sha256sum -c -

      - name: Install NDK and CMake (Phase J native build)
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch oboe and the mGBA core (pinned, Phase J)
        run: |
          mkdir -p third_party/oboe app/src/main/jniLibs/arm64-v8a
          curl -sL -o /tmp/oboe.tar.gz https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz
          echo "e030276d25b8bdfaeb04f66646821b1ba4a2b6a580a7e84fb144a478eaecd663  /tmp/oboe.tar.gz" | sha256sum -c -
          tar -xzf /tmp/oboe.tar.gz -C third_party/oboe --strip-components=1
          curl -sL -o /tmp/mgba.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mgba_libretro_android.so.zip
          echo "4ece9e2b56090723d57dc706285601a09c27373c0f637b76d9f5891ff12ea2b8  /tmp/mgba.zip" | sha256sum -c -
          unzip -o /tmp/mgba.zip -d /tmp/mgba
          cp /tmp/mgba/mgba_libretro_android.so app/src/main/jniLibs/arm64-v8a/libmgba_libretro_android.so
          curl -sL -o /tmp/fceumm.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/fceumm_libretro_android.so.zip
          echo "19b3741f1f4c2b09129ac09d3aae70062e5019f9c73de6f78963fe4994a0099f  /tmp/fceumm.zip" | sha256sum -c -
          unzip -o /tmp/fceumm.zip -d /tmp/fceumm
          cp /tmp/fceumm/fceumm_libretro_android.so app/src/main/jniLibs/arm64-v8a/libfceumm_libretro_android.so
          curl -sL -o /tmp/snes9x.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip
          echo "7d07774a77782c3080b345990e91ad0115140bdee51dc2155b170eeeabe37efa  /tmp/snes9x.zip" | sha256sum -c -
          unzip -o /tmp/snes9x.zip -d /tmp/snes9x
          cp /tmp/snes9x/snes9x_libretro_android.so app/src/main/jniLibs/arm64-v8a/libsnes9x_libretro_android.so
          curl -sL -o /tmp/gpgx.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/genesis_plus_gx_libretro_android.so.zip
          echo "af3ea8b66dd0822d53bb878955d187d48c97652397f9525a966db2c73a1f31f8  /tmp/gpgx.zip" | sha256sum -c -
          unzip -o /tmp/gpgx.zip -d /tmp/gpgx
          cp /tmp/gpgx/genesis_plus_gx_libretro_android.so app/src/main/jniLibs/arm64-v8a/libgenesis_plus_gx_libretro_android.so

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notscape-mariner-apk
          path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download the signed APK
        uses: actions/download-artifact@v4
        with:
          name: notscape-mariner-apk
          path: apk

      - name: Read version and check the tag matches it
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match version $VERSION — refusing to publish."
            exit 1
          fi

      - name: Build release notes from the commit message
        id: notes
        run: |
          # What's-new (0.1.0-beta.1): build commits carry "## <Category>"
          # sections below their title line. The title line is dropped
          # here; the sections become the release body, which the
          # Updates page renders grouped under their headings.
          RAW=$(git log -1 --pretty=%B "${{ github.ref_name }}")
          NOTES=$(printf '%s\n' "$RAW" | tail -n +2 | sed -e '/./,$!d')
          if [ -z "$NOTES" ]; then
            NOTES="Beta build of Notscape Mariner."
          fi
          {
            echo "body<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notscape Mariner ${{ steps.version.outputs.version }} (beta)
          prerelease: true
          fail_on_unmatched_files: true
          files: apk/*.apk
          body: ${{ steps.notes.outputs.body }}
